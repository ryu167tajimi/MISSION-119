<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笠原消防署｜職場体験 お疲れ様！</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d17;font-family:system-ui,'Meiryo',sans-serif;color:white}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.poster{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;flex:none;background:url('poster.png') center/contain no-repeat}.portrait{position:absolute;left:64.0%;top:55.2%;width:16.4%;height:31.6%;object-fit:cover;display:none;border-radius:3%;transform:rotate(-2deg)}.toolbar{position:fixed;left:12px;bottom:12px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar label,.toolbar button{font-size:14px;cursor:pointer;color:white;border:1px solid #ffffff88;border-radius:12px;background:#091d3dc9;padding:10px 15px}.toolbar input{display:none}.note{font-size:12px;color:#fff;background:#091d3dc9;padding:8px;border-radius:8px}body.presentation .toolbar{opacity:0;transition:opacity .2s}body.presentation .toolbar:hover{opacity:1}@media print{.toolbar{display:none}.stage{height:auto}.poster{width:100vw}}
</style></head><body><main class="stage"><div class="poster"><img id="portrait" class="portrait" alt="追加した職場体験写真"></div></main><div class="toolbar"><label>📷 写真を入れる<input type="file" id="file" accept="image/*"></label><button id="full">⛶ 全画面</button><button id="clear">写真を外す</button><span class="note">写真はこの端末でのみ表示され、送信されません</span></div><script>
const photo=document.getElementById('portrait');let url=null;document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);photo.src=url;photo.style.display='block'});document.getElementById('clear').onclick=()=>{photo.style.display='none';photo.removeAttribute('src');document.getElementById('file').value='';if(url)URL.revokeObjectURL(url);url=null};document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.body.classList.add('presentation')}else{await document.exitFullscreen();document.body.classList.remove('presentation')}}catch(e){alert('全画面表示はブラウザのF11キーでも切り替えられます。')}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('presentation')});
</script></body></html>
